<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Miku Green Gradient -->
    <linearGradient id="mikuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#39C5BB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2FA89E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A8A80;stop-opacity:1" />
    </linearGradient>
    
    <!-- Pink Accent -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4081;stop-opacity:1" />
    </linearGradient>
    
    <!-- Purple Accent -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BA68C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Strong Glow -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feComposite in="SourceGraphic" in2="coloredBlur" operator="over"/>
    </filter>
    
    <!-- Sparkle -->
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#39C5BB;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" fill="#0a0a1a"/>
  
  <!-- Animated Grid -->
  <g opacity="0.15">
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#39C5BB" stroke-width="0.5"/>
    </pattern>
    <rect width="500" height="500" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" values="0,0;25,25;0,0" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Musical Notes (Miku's theme) -->
  <g filter="url(#glow)" opacity="0.6">
    <!-- Note 1 -->
    <g transform="translate(80, 100)">
      <ellipse cx="0" cy="0" rx="8" ry="6" fill="#39C5BB" transform="rotate(-20)"/>
      <line x1="6" y1="-2" x2="6" y2="-35" stroke="#39C5BB" stroke-width="2"/>
      <path d="M6,-35 Q20,-30 6,-20" fill="#39C5BB"/>
      <animateMotion dur="6s" repeatCount="indefinite" path="M0,0 C30,-40 60,20 0,0"/>
    </g>
    
    <!-- Note 2 -->
    <g transform="translate(420, 120)">
      <ellipse cx="0" cy="0" rx="8" ry="6" fill="#FF6B9D" transform="rotate(-20)"/>
      <line x1="6" y1="-2" x2="6" y2="-35" stroke="#FF6B9D" stroke-width="2"/>
      <path d="M6,-35 Q20,-30 6,-20" fill="#FF6B9D"/>
      <animateMotion dur="8s" repeatCount="indefinite" path="M0,0 C-40,30 -20,60 0,0"/>
    </g>
    
    <!-- Note 3 -->
    <g transform="translate(150, 380)">
      <ellipse cx="0" cy="0" rx="7" ry="5" fill="#BA68C8" transform="rotate(-20)"/>
      <line x1="5" y1="-2" x2="5" y2="-30" stroke="#BA68C8" stroke-width="2"/>
      <path d="M5,-30 Q18,-25 5,-15" fill="#BA68C8"/>
      <animateMotion dur="7s" repeatCount="indefinite" path="M0,0 C50,-20 30,40 0,0"/>
    </g>
  </g>
  
  <!-- Center Star (Miku's symbol) -->
  <g transform="translate(250, 250)" filter="url(#strongGlow)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#mikuGrad)" stroke-width="2" stroke-dasharray="10,5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Middle Ring -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#pinkGrad)" stroke-width="1.5" stroke-dasharray="8,4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Inner Ring -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#purpleGrad)" stroke-width="1" stroke-dasharray="6,3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Star Shape -->
    <polygon points="0,-70 18,-25 65,-25 28,5 40,50 0,25 -40,50 -28,5 -65,-25 -18,-25" 
             fill="url(#mikuGrad)" opacity="0.9">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="4s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Center Glow -->
    <circle cx="0" cy="0" r="20" fill="url(#sparkle)" opacity="0.8">
      <animate attributeName="r" values="18;25;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Miku Number 39 -->
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
          fill="#ffffff" text-anchor="middle" filter="url(#glow)">
      39
    </text>
  </g>
  
  <!-- Floating Particles -->
  <g filter="url(#glow)">
    <!-- Particles around the star -->
    <circle cx="250" cy="250" r="3" fill="#39C5BB">
      <animateMotion dur="4s" repeatCount="indefinite" path="M0,0 C80,-60 60,80 0,0"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="250" cy="250" r="2" fill="#FF6B9D">
      <animateMotion dur="5s" repeatCount="indefinite" path="M0,0 C-70,50 -50,-70 0,0"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="250" cy="250" r="2.5" fill="#BA68C8">
      <animateMotion dur="6s" repeatCount="indefinite" path="M0,0 C60,70 -80,30 0,0"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="6s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="250" cy="250" r="2" fill="#ffffff">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M0,0 C-50,-80 90,-20 0,0"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="250" cy="250" r="1.5" fill="#39C5BB">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M0,0 C90,40 -60,80 0,0"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Waveform (Miku's voice) -->
  <g transform="translate(250, 400)" opacity="0.4">
    <path d="M-150,0 Q-120,-20 -90,0 Q-60,20 -30,0 Q0,-20 30,0 Q60,20 90,0 Q120,-20 150,0" 
          fill="none" stroke="url(#mikuGrad)" stroke-width="2">
      <animate attributeName="d" 
               values="M-150,0 Q-120,-20 -90,0 Q-60,20 -30,0 Q0,-20 30,0 Q60,20 90,0 Q120,-20 150,0;
                       M-150,0 Q-120,20 -90,0 Q-60,-20 -30,0 Q0,20 30,0 Q60,-20 90,0 Q120,20 150,0;
                       M-150,0 Q-120,-20 -90,0 Q-60,20 -30,0 Q0,-20 30,0 Q60,20 90,0 Q120,-20 150,0"
               dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Text: 星工厂 -->
  <text x="250" y="340" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        fill="url(#mikuGrad)" text-anchor="middle" filter="url(#glow)">
    星工厂
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
  </text>
  
  <!-- Text: Star Factory -->
  <text x="250" y="370" font-family="Arial, sans-serif" font-size="20" 
        fill="#ffffff" text-anchor="middle" opacity="0.8">
    Star Factory
  </text>
  
  <!-- Text: 39 -->
  <text x="250" y="450" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="url(#pinkGrad)" text-anchor="middle" filter="url(#glow)" opacity="0.7">
    39
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
  </text>
  
  <!-- Slogan -->
  <text x="250" y="480" font-family="Arial, sans-serif" font-size="14" 
        fill="#39C5BB" text-anchor="middle" opacity="0.6">
    重建互联网精神 | Rebuild Internet Spirit
  </text>
  
  <!-- Corner Decorations -->
  <g opacity="0.3">
    <!-- Top Left -->
    <path d="M20,20 L50,20 M20,20 L20,50" stroke="#39C5BB" stroke-width="2"/>
    <!-- Top Right -->
    <path d="M480,20 L450,20 M480,20 L480,50" stroke="#FF6B9D" stroke-width="2"/>
    <!-- Bottom Left -->
    <path d="M20,480 L50,480 M20,480 L20,450" stroke="#BA68C8" stroke-width="2"/>
    <!-- Bottom Right -->
    <path d="M480,480 L450,480 M480,480 L480,450" stroke="#39C5BB" stroke-width="2"/>
  </g>
  
  <!-- Leek (Miku's iconic item) -->
  <g transform="translate(400, 100)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="15" ry="40" fill="#4CAF50" transform="rotate(15)"/>
    <ellipse cx="0" cy="-20" rx="12" ry="15" fill="#66BB6A"/>
    <animateTransform attributeName="transform" type="rotate" values="15;20;15" dur="4s" repeatCount="indefinite"/>
  </g>
  
  <!-- Watermark -->
  <text x="490" y="495" font-family="Arial, sans-serif" font-size="11" 
        fill="#ffffff" text-anchor="end" opacity="0.25">
    fxrc
  </text>
</svg>